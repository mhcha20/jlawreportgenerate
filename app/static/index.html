<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JLaw 報告生成</title>
<style>
:root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --mute:#6b7280; --line:#e3e6eb; --pri:#1f5fbf; --ok:#15803d; --bad:#b91c1c; --warn:#b45309; }
@media (prefers-color-scheme: dark) { :root { --bg:#12151b; --card:#1b2029; --ink:#e7eaf0; --mute:#9aa3b2; --line:#2c3340; --pri:#5b9bff; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 -apple-system, "Noto Sans TC", "PingFang TC", sans-serif; }
main { max-width:760px; margin:0 auto; padding:16px; }
h1 { font-size:20px; margin:4px 0 2px; } .sub { color:var(--mute); font-size:13px; margin-bottom:14px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
.card h2 { font-size:16px; margin:0 0 10px; }
label { font-size:13px; color:var(--mute); display:block; margin-bottom:4px; }
input, select { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:100%; }
.row { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; } .row > div { flex:1; min-width:150px; }
button { font:inherit; border:0; border-radius:8px; padding:10px 16px; background:var(--pri); color:#fff; cursor:pointer; font-weight:600; }
button.sec { background:transparent; color:var(--pri); border:1px solid var(--pri); padding:6px 12px; font-weight:500; }
button:disabled { opacity:.45; cursor:default; }
.big { width:100%; padding:14px; font-size:17px; margin-top:12px; }
.chk { display:flex; gap:8px; align-items:center; margin-top:10px; font-size:14px; } .chk input { width:auto; }
.shots { display:flex; flex-wrap:wrap; gap:4px; margin-top:10px; }
.shots span { font-size:12px; padding:2px 7px; border-radius:6px; border:1px solid var(--line); }
.shots .y { color:var(--ok); border-color:var(--ok); } .shots .n { color:var(--bad); border-color:var(--bad); }
.msg { font-size:14px; margin-top:8px; } .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
.job { border-top:1px solid var(--line); padding:10px 0; } .job:first-of-type { border-top:0; }
.job .hd { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.st { font-size:12px; padding:1px 8px; border-radius:10px; border:1px solid currentColor; }
.log { font:12px/1.5 ui-monospace, Menlo, monospace; background:var(--bg); border-radius:8px; padding:8px; margin-top:8px; max-height:260px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
.acts { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
.mute { color:var(--mute); font-size:13px; }
#login { max-width:360px; margin:60px auto; }
.gbtn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:13px; border:1px solid var(--line); border-radius:8px; background:#fff; color:#1f1f1f; font-weight:600; text-decoration:none; margin:6px 0 12px; }
.who { font-size:12px; color:var(--mute); margin-bottom:10px; } .who a { color:var(--pri); }
.tabs { display:flex; gap:6px; margin-bottom:12px; } .tabs button { flex:1; background:transparent; color:var(--pri); border:1px solid var(--pri); }
.tabs button.on { background:var(--pri); color:#fff; }
.slist { display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:6px; margin-top:10px; max-height:340px; overflow:auto; }
.slist label { display:flex; gap:5px; align-items:center; font-size:13px; border:1px solid var(--line); border-radius:8px; padding:5px 7px; color:var(--ink); margin:0; }
.slist label.bad { color:var(--mute); } .slist input { width:auto; }
.srow { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; } .srow input[type=search] { flex:1; min-width:140px; }
.srow select { width:auto; flex:0 0 auto; padding:6px 8px; font-size:14px; }
.watch { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; padding:10px; border:1px dashed var(--line); border-radius:10px; }
.watch #wlist { flex-basis:100%; font-size:12px; }
.chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.chips button { background:transparent; color:var(--ink); border:1px solid var(--line); padding:5px 10px; font-size:13px; font-weight:500; border-radius:16px; }
.chips button.on { background:var(--pri); color:#fff; border-color:var(--pri); }
.slist .grp { grid-column:1 / -1; display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:700; color:var(--mute); margin-top:6px; }
.slist .grp:first-child { margin-top:0; } .slist .grp button { padding:3px 9px; font-size:12px; font-weight:500; }
.slist label small { color:var(--mute); font-size:11px; margin-left:auto; }
.slist label small.dn { color:var(--ok); font-weight:600; } .slist label small.busy { color:var(--warn); }
#viewer { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50; display:flex; flex-direction:column; }
#viewer[hidden] { display:none; }
#viewer .vbar { display:flex; gap:8px; align-items:center; padding:10px 12px; background:var(--card); border-bottom:1px solid var(--line); }
#viewer .vbar b { flex:1; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#viewer .vbar button { padding:7px 11px; font-size:13px; }
#viewer .vbody { flex:1; overflow:auto; padding:12px; -webkit-overflow-scrolling:touch; }
#viewer .vbody img { display:block; width:100%; max-width:900px; margin:0 auto 10px; background:#fff; border-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,.3); }
#viewer .vbody .mute { color:#eee; text-align:center; }
</style>
</head>
<body>
<main>
  <div id="login" class="card" hidden>
    <h2>JLaw 報告生成</h2>
    <a class="gbtn" id="gLogin" href="/auth/google" hidden><svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.2 1.5-5 2.3-8.2 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>用 Google 登入</a>
    <div id="pwBox" hidden>
      <label for="pw">網站密碼</label>
      <input id="pw" type="password" autocomplete="current-password">
      <button class="big" id="loginBtn">登入</button>
    </div>
    <div class="msg bad" id="loginMsg"></div>
  </div>

  <div id="app" hidden>
    <h1>JLaw 報告生成</h1>
    <div class="who" id="who"></div>
    <div class="sub">由 Google Drive 截圖自動出大盤同個股報告 · AI 睇圖分析、上網核實 · QA 全過先出 PDF</div>

    <div class="tabs"><button id="tabM" class="on">大盤報告</button><button id="tabS">個股報告</button></div>
    <div class="card" id="cardM">
      <h2>出大盤報告</h2>
      <div class="row">
        <div><label for="date">美國交易日</label><select id="date"></select></div>
        <div style="flex:0"><button class="sec" id="reload">重新檢查</button></div>
      </div>
      <div class="msg" id="shotMsg">檢查截圖中…</div>
      <div class="shots" id="shots"></div>
      <label class="chk"><input type="checkbox" id="up"> 完成後自動上載到報告中心（Drive）</label>
      <button class="big" id="go" disabled>出報告</button>
      <div class="msg" id="goMsg"></div>
      <div class="mute" style="margin-top:6px">每份約需 10–20 分鐘；AI API 按用量收費（每份約 US$2–6，完成後會顯示實際用量）。</div>
    </div>

    <div class="card" id="cardS" hidden>
      <h2>出個股報告（行動卡＋本體報告＋核對附錄）</h2>
      <div class="row">
        <div><label for="sdate">交易日（亞洲股收市後就揀得）</label><select id="sdate"></select></div>
        <div style="flex:0"><button class="sec" id="sreload">重新檢查</button></div>
      </div>
      <div class="msg" id="sMsg"></div>
      <div class="srow"><input type="search" id="sfind" placeholder="搵代號／名稱">
        <select id="ssort" aria-label="排列"><option value="theme">按行業分組</option><option value="code">按代號 A–Z／數字</option></select></div>
      <div class="chips" id="smkt"></div>
      <div class="chips" id="stheme"></div>
      <div class="watch">
        <button id="wpick">⭐ 每日清單</button>
        <button class="sec" id="wsave">將而家剔咗嘅存做每日清單</button>
        <div class="mute" id="wlist"></div>
      </div>
      <div class="srow"><button class="sec" id="sall">揀晒顯示中截圖齊嘅</button><button class="sec" id="snone">清除</button></div>
      <div class="slist" id="slist"></div>
      <label class="chk"><input type="checkbox" id="sup"> 完成後自動上載到報告中心（Drive）</label>
      <button class="big" id="sgo" disabled>出報告</button>
      <div class="msg" id="sgoMsg"></div>
      <div class="mute" style="margin-top:6px">每隻約 15 分鐘、約 US$2–4；同時做 2 隻，其餘排隊。美股會承襲當日大盤報告，建議先出大盤。</div>
    </div>

    <div class="card">
      <h2>報告紀錄</h2>
      <div class="mute" id="autoNote"></div>
      <div class="srow" id="qbar" hidden><span class="mute" id="qinfo"></span><button class="sec" id="qcancel">取消全部排緊隊</button></div>
      <div id="jobs"><div class="mute">載入中…</div></div>
    </div>
  </div>
</main>
<div id="viewer" hidden>
  <div class="vbar"><b id="vtitle"></b><button class="sec" id="vdl">下載 PDF</button><button class="sec" id="vnew">新分頁開</button><button id="vclose">閂</button></div>
  <div class="vbody" id="vbody"></div>
</div>
<script>
let PW = ''; try { PW = localStorage.getItem('pw') || ''; } catch (e) {}
const $ = id => document.getElementById(id);
const api = async (path, opt = {}) => {
  const r = await fetch(path, {...opt, headers: {'x-password': PW, 'Content-Type': 'application/json', ...(opt.headers || {})}});
  if (r.status === 401) { showLogin(PW && auth.password ? '密碼錯誤' : '請先登入'); throw new Error('401'); }
  const j = r.headers.get('content-type')?.includes('json') ? await r.json() : r;
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let auth = {google: false, password: true};
function showLogin(m) {
  $('app').hidden = true; $('login').hidden = false; $('loginMsg').textContent = m || '';
  $('gLogin').hidden = !auth.google; $('pwBox').hidden = !auth.password;
  if (!auth.google && !auth.password) $('loginMsg').textContent = '伺服器未設定登入方式';
}
async function login() {
  PW = $('pw').value; try { localStorage.setItem('pw', PW); } catch (e) {}
  try { await api('/api/auth', {method: 'POST', body: '{}'}); start('密碼'); } catch (e) { if (e.message !== '401') $('loginMsg').textContent = e.message; }
}
$('loginBtn').onclick = login; $('pw').onkeydown = e => { if (e.key === 'Enter') login(); };

let shotsOk = false, timer = null;
async function loadDates() {
  try {
    const d = await api('/api/dates'); const set = new Set(d.dates); if (!set.has(d.default)) d.dates.unshift(d.default);
    $('date').innerHTML = d.dates.map(x => `<option ${x === d.default ? 'selected' : ''}>${x}</option>`).join('');
    const sd = d.stock_dates || d.dates, sdef = d.stock_default || d.default;
    $('sdate').innerHTML = sd.map(x => `<option value="${x}" ${x === sdef ? 'selected' : ''}>${x}${d.dates.includes(x) ? '' : '（未有美股）'}</option>`).join('');
  } catch (e) { $('shotMsg').innerHTML = `<span class="bad">讀唔到 Drive 日期：${esc(e.message)}</span>`; }
  checkShots();
}
async function checkShots() {
  const d = $('date').value; shotsOk = false; $('go').disabled = true; $('shotMsg').textContent = '檢查截圖中…'; $('shots').innerHTML = '';
  try {
    const s = await api('/api/shots?date=' + d);
    const all = ['IWM','VIX','SPY','QQQ','SOX','XLK','XLF','XLE','XLV','XLY','XLB','XLC','XLI','XLP','XLU','XLRE','DXY','GC1!','US10Y'];
    if (!s.folder) $('shotMsg').innerHTML = `<span class="warn">Drive 未有「${esc(s.name)}」資料夾（截圖未上載？）</span>`;
    else if (s.missing.length) $('shotMsg').innerHTML = `<span class="warn">截圖未齊：${s.have.length}/19，缺 ${esc(s.missing.join('、'))}</span>`;
    else { $('shotMsg').innerHTML = `<span class="ok">✓ 19 張截圖齊（${esc(s.name)}）</span>`; shotsOk = true; }
    $('shots').innerHTML = all.map(t => `<span class="${s.missing.includes(t) ? 'n' : 'y'}">${t}</span>`).join('');
  } catch (e) { $('shotMsg').innerHTML = `<span class="bad">檢查失敗：${esc(e.message)}</span>`; }
  $('go').disabled = !shotsOk;
}
$('date').onchange = checkShots; $('reload').onclick = checkShots;
$('go').onclick = async () => {
  try {
    const d = await api('/api/market_done?date=' + $('date').value);
    if ((d.site || d.drive) && !confirm(`${$('date').value} 嘅大盤報告${d.site ? '本站已經出過（或者做緊）' : 'Drive 已經有'}。\n再做會再收一次費（約 US$2–8）。確定要重做？`)) return;
  } catch (e) {}
  $('go').disabled = true; $('goMsg').textContent = '';
  try {
    const r = await api('/api/generate', {method: 'POST', body: JSON.stringify({date: $('date').value, upload: $('up').checked})});
    $('goMsg').innerHTML = r.created ? '<span class="ok">已開始，下面睇進度</span>' : '<span class="warn">呢日已經做緊，下面睇進度</span>';
    loadJobs();
  } catch (e) { $('goMsg').innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
  $('go').disabled = !shotsOk;
};
const ST = {queued: ['排隊中', 'warn'], running: ['進行中', 'warn'], done: ['完成', 'ok'], failed: ['失敗', 'bad'], cancelled: ['已取消', '']};
let canUpload = false, openLog = new Set();
async function loadJobs() {
  let d; try { d = await api('/api/jobs'); } catch (e) { return; }
  canUpload = d.can_upload;
  $('autoNote').textContent = d.auto ? '每日定時排程：已開（香港朝早截圖齊就自動出）' : '每日定時排程：未開';
  if (!d.jobs.length) { $('jobs').innerHTML = '<div class="mute">未有紀錄</div>'; }
  else $('jobs').innerHTML = d.jobs.map(j => {
    const [t, c] = ST[j.status] || [j.status, ''];
    return `<div class="job"><div class="hd"><b>${esc(j.date)} ${j.kind === 'stock' ? esc(j.ticker) + ' 個股報告' : '大盤報告'}</b><span class="st ${c}">${t}</span></div>
      <div class="mute">${esc(j.created)} · ${esc(j.by)}${j.engine === 'grok' ? ' · 後備 Grok' : ''}${j.cost ? ` · 約 US$${j.cost}` : ''}${j.pages ? ` · ${j.pages} 頁` : ''}${j.uploaded ? ' · 已上載 Drive' : ''}</div>
      ${j.result ? `<div class="mute">${esc(j.result.rating)} ${esc(j.result.score)}／100 · ${esc(j.result.action)}</div>` : ''}
      <div class="mute">${esc(j.error || j.last)}</div>
      <div class="acts">${(j.pdfs && j.pdfs.length ? j.pdfs : (j.pdf ? [j.pdf] : [])).map((f, i) => `<button class="sec" onclick="openPdf('${j.id}', ${i})">${f.includes('行動卡') ? '行動卡' : f.includes('終極報告') ? '本體報告' : f.includes('核對附錄') ? '核對附錄' : '睇 PDF'}</button>`).join('')}
        ${j.pdf && canUpload && !j.uploaded ? `<button class="sec" onclick="upload('${j.id}', this)">上載 Drive</button>` : ''}
        <button class="sec" onclick="toggleLog('${j.id}')">進度紀錄</button>
        ${j.status === 'queued' || j.status === 'running' ? `<button class="sec" onclick="cancelJob('${j.id}', this)">${j.status === 'queued' ? '取消' : '停止'}</button>` : ''}</div>
      <div class="log" id="log-${j.id}" ${openLog.has(j.id) ? '' : 'hidden'}></div></div>`;
  }).join('');
  for (const id of openLog) fillLog(id);
  const nq = d.n_queued ?? d.jobs.filter(j => j.status === 'queued').length, nr = d.n_running ?? d.jobs.filter(j => j.status === 'running').length;
  $('qbar').hidden = !nq; $('qinfo').textContent = `做緊 ${nr} 份、排緊隊 ${nq} 份`;
  clearTimeout(timer); timer = setTimeout(loadJobs, d.jobs.some(j => j.status === 'running' || j.status === 'queued') ? 4000 : 30000);
}
async function cancelJob(id, btn) {
  if (!confirm('取消呢份報告？做緊嘅會喺下一步停（已經用咗嘅 API 費用唔會退）。')) return;
  btn.disabled = true; try { await api(`/api/jobs/${id}/cancel`, {method: 'POST', body: '{}'}); loadJobs(); } catch (e) { alert(e.message); btn.disabled = false; }
}
$('qcancel').onclick = async () => {
  if (!confirm('取消全部排緊隊嘅報告？做緊嗰啲會照做完（要停就逐個撳「停止」）。')) return;
  try { const r = await api('/api/cancel_queued', {method: 'POST', body: '{}'}); alert(`取消咗 ${r.cancelled} 份`); loadJobs(); } catch (e) { alert(e.message); }
};
async function fillLog(id) { try { const j = await api('/api/jobs/' + id); const el = $('log-' + id); if (el) { el.textContent = j.log.join('\n'); el.scrollTop = el.scrollHeight; } } catch (e) {} }
function toggleLog(id) { const el = $('log-' + id); el.hidden = !el.hidden; if (el.hidden) openLog.delete(id); else { openLog.add(id); fillLog(id); } }
// 喺同一版睇 PDF：伺服器將每頁轉做圖片（手機睇得順），另有下載／新分頁
let vCur = null, vUrls = [];
function closeViewer() { $('viewer').hidden = true; $('vbody').innerHTML = ''; vUrls.forEach(u => URL.revokeObjectURL(u)); vUrls = []; document.body.style.overflow = ''; vCur = null; }
async function openPdf(id, i = 0) {
  vCur = {id, i}; $('viewer').hidden = false; document.body.style.overflow = 'hidden';
  $('vtitle').textContent = '載入中…'; $('vbody').innerHTML = '<div class="mute">載入中…</div>';
  try {
    const info = await api(`/api/jobs/${id}/page?i=${i}&count=1`);
    if (!vCur || vCur.id !== id || vCur.i !== i) return;
    $('vtitle').textContent = info.name.replace(/\.pdf$/i, '') + `（${info.pages} 頁）`; $('vbody').innerHTML = '';
    for (let p = 1; p <= info.pages; p++) {
      const img = document.createElement('img'); img.alt = `第 ${p} 頁`; $('vbody').appendChild(img);
      const r = await api(`/api/jobs/${id}/page?i=${i}&p=${p}`); const u = URL.createObjectURL(await r.blob());
      if (!vCur || vCur.id !== id || vCur.i !== i) { URL.revokeObjectURL(u); return; }
      vUrls.push(u); img.src = u;
    }
  } catch (e) { $('vbody').innerHTML = `<div class="mute">開唔到：${esc(e.message)}</div>`; }
}
async function pdfBlob() { const r = await api(`/api/jobs/${vCur.id}/pdf?i=${vCur.i}`); return r.blob(); }
$('vclose').onclick = closeViewer;
$('viewer').onclick = e => { if (e.target.id === 'viewer') closeViewer(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('viewer').hidden) closeViewer(); });
$('vdl').onclick = async () => {
  if (!vCur) return;
  try { const b = await pdfBlob(); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = $('vtitle').textContent.replace(/（\d+ 頁）$/, '') + '.pdf'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000); }
  catch (e) { alert(e.message); }
};
$('vnew').onclick = async () => {
  if (!vCur) return; const w = window.open('', '_blank');
  try { const u = URL.createObjectURL(await pdfBlob()); if (w) w.location = u; else location = u; } catch (e) { if (w) w.close(); alert(e.message); }
};
async function upload(id, btn) {
  if (!confirm('上載到報告中心 Drive？（同名舊檔會放入垃圾桶）')) return;
  btn.disabled = true;
  try { await api(`/api/jobs/${id}/upload`, {method: 'POST', body: '{}'}); loadJobs(); } catch (e) { alert('上載失敗：' + e.message); btn.disabled = false; }
}
let stocks = [], picked = new Set();
function tab(which) { $('tabM').classList.toggle('on', which === 'M'); $('tabS').classList.toggle('on', which === 'S'); $('cardM').hidden = which !== 'M'; $('cardS').hidden = which !== 'S'; if (which === 'S' && !stocks.length) loadStocks(); }
$('tabM').onclick = () => tab('M'); $('tabS').onclick = () => tab('S');
async function loadStocks() {
  const d = $('sdate').value; if (!d) return; $('sMsg').textContent = '檢查個股截圖中…'; $('slist').innerHTML = '';
  try {
    const r = await api('/api/stocks?date=' + d); stocks = r.rows;
    const ok = stocks.filter(x => x.status === 'ok').length;
    const none = stocks.filter(x => x.status === 'none').length;
    $('sMsg').innerHTML = `<span class="${ok ? 'ok' : 'warn'}">${stocks.length} 隻股票，${ok} 隻截圖齊${none ? `，${none} 隻呢日未有截圖` : ''}</span>`;
  } catch (e) { stocks = []; $('sMsg').innerHTML = `<span class="bad">檢查失敗：${esc(e.message)}</span>`; }
  drawStocks(); drawWatch();
}
const MKT = [['all', '全部'], ['ok', '截圖齊'], ['us', '美股'], ['etf', 'ETF'], ['asia', '亞洲'], ['foreign', '外國股'], ['bad', '截圖未齊／未有']];
let sMkt = 'all', sTheme = 'all';
try { const v = JSON.parse(localStorage.getItem('sview') || '{}'); if (v.sort) $('ssort').value = v.sort; if (v.mkt) sMkt = v.mkt; } catch (e) {}
const mktOf = x => x.layout === 'etf' ? 'etf' : x.layout === 'asia' ? 'asia' : x.layout === 'foreign' ? 'foreign' : 'us';
// 代號排序：英文字母 A–Z 先，再到數字代號由細到大
const codeCmp = (a, b) => { const na = /^\d+$/.test(a), nb = /^\d+$/.test(b); return na !== nb ? (na ? 1 : -1) : na ? Number(a) - Number(b) : a.localeCompare(b); };
function shown() {
  const f = $('sfind').value.trim().toUpperCase();
  return stocks.filter(x => (!f || x.ticker.includes(f) || (x.name || '').toUpperCase().includes(f))
    && (sMkt === 'all' || (sMkt === 'bad' ? x.status !== 'ok' : sMkt === 'ok' ? x.status === 'ok' : mktOf(x) === sMkt))
    && (sTheme === 'all' || (x.theme || '未分類') === sTheme)).sort((a, b) => codeCmp(a.ticker, b.ticker));
}
function chipRow(el, items, cur, set) {
  el.innerHTML = items.map(([k, label]) => `<button class="${k === cur ? 'on' : ''}" data-k="${esc(k)}">${esc(label)}</button>`).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => { set(b.dataset.k); drawStocks(); });
}
const DONE = {site: ['✓已出', '呢日本站已經出咗報告'], drive: ['✓Drive', 'Drive 報告中心已經有呢日嘅行動卡'], busy: ['做緊', '呢日做緊／排緊隊']};
function box(x) {
  const ok = x.status === 'ok';
  const none = x.status === 'none';
  const tip = (x.name ? x.name + '｜' : '') + (ok ? '截圖齊' : none ? '呢日未有截圖' : '截圖未齊' + (x.missing && x.missing.length ? '，缺 ' + x.missing.join('、') : ''));
  const dn = DONE[x.done];
  return `<label class="${ok ? '' : 'bad'}" title="${esc(tip + (dn ? '｜' + dn[1] : ''))}"><input type="checkbox" ${ok ? '' : 'disabled'} ${picked.has(x.ticker) ? 'checked' : ''} onchange="pick('${x.ticker}', this.checked)">${esc(x.ticker)}${ok ? '' : none ? ' –' : ' ✗'}${dn ? `<small class="dn ${x.done}">${dn[0]}</small>` : mktOf(x) === 'etf' ? '<small>ETF</small>' : ''}</label>`;
}
function drawStocks() {
  try { localStorage.setItem('sview', JSON.stringify({sort: $('ssort').value, mkt: sMkt})); } catch (e) {}
  const cnt = k => stocks.filter(x => k === 'all' || (k === 'bad' ? x.status !== 'ok' : k === 'ok' ? x.status === 'ok' : mktOf(x) === k)).length;
  chipRow($('smkt'), MKT.filter(([k]) => k === 'all' || cnt(k)).map(([k, l]) => [k, `${l} ${cnt(k)}`]), sMkt, k => sMkt = k);
  const themes = [...new Set(stocks.map(x => x.theme || '未分類'))].sort((a, b) => (a === '未分類') - (b === '未分類') || a.localeCompare(b, 'zh-Hant'));
  $('stheme').hidden = themes.length < 2;
  if (!themes.includes(sTheme)) sTheme = 'all';
  chipRow($('stheme'), [['all', '全部行業'], ...themes.map(t => [t, t])], sTheme, k => sTheme = k);
  const list = shown();
  if (!list.length) $('slist').innerHTML = '<div class="mute" style="grid-column:1/-1">冇符合嘅股票</div>';
  else if ($('ssort').value === 'theme') {
    const groups = {}; list.forEach(x => (groups[x.theme || '未分類'] ||= []).push(x));
    $('slist').innerHTML = themes.filter(t => groups[t]).map(t => `<div class="grp"><span>${esc(t)}（${groups[t].length}）</span><button class="sec" data-t="${esc(t)}">揀晒呢組</button></div>` + groups[t].map(box).join('')).join('');
    $('slist').querySelectorAll('.grp button').forEach(b => b.onclick = () => pickGroup(b.dataset.t));
  } else $('slist').innerHTML = list.map(box).join('');
  $('sgo').disabled = !picked.size; $('sgo').textContent = picked.size ? `出報告（${picked.size} 隻，約 US$${picked.size * 2}–${picked.size * 4}）` : '出報告';
}
function pickGroup(t) { shown().filter(x => (x.theme || '未分類') === t && x.status === 'ok').forEach(x => picked.add(x.ticker)); drawStocks(); }
$('ssort').onchange = drawStocks;
function pick(t, on) { on ? picked.add(t) : picked.delete(t); drawStocks(); }
$('sfind').oninput = drawStocks; $('sreload').onclick = loadStocks; $('sdate').onchange = () => { picked.clear(); loadStocks(); };
// 每日清單：一撳就剔晒（截圖未齊嘅會列出），剔完可以照改；改完撳「存做每日清單」
let watch = [];
async function loadWatch() { try { watch = (await api('/api/watchlist')).tickers; } catch (e) {} drawWatch(); }
function drawWatch() {
  $('wpick').textContent = `⭐ 每日清單（${watch.length}）`;
  if (!watch.length) { $('wlist').textContent = '未有清單：剔好股票再撳「存做每日清單」'; return; }
  const by = Object.fromEntries(stocks.map(x => [x.ticker, x]));
  $('wlist').innerHTML = watch.map(t => { const x = by[t]; const st = !stocks.length ? '' : !x ? '（冇呢隻）' : x.status === 'ok' ? '' : x.status === 'none' ? '（未有截圖）' : '（截圖未齊）';
    return `<span class="${st ? 'warn' : ''}">${esc(t)}${st}</span>`; }).join('、');
}
$('wpick').onclick = () => {
  const by = Object.fromEntries(stocks.map(x => [x.ticker, x]));
  const ok = watch.filter(t => by[t] && by[t].status === 'ok'), skip = watch.filter(t => !ok.includes(t));
  picked.clear(); ok.forEach(t => picked.add(t));
  sMkt = 'all'; sTheme = 'all'; $('sfind').value = ''; drawStocks();
  $('sgoMsg').innerHTML = `<span class="ok">已剔 ${ok.length} 隻</span>` + (skip.length ? `<span class="warn">；${esc(skip.join('、'))} 呢日截圖未齊／未有，冇剔</span>` : '');
};
$('wsave').onclick = async () => {
  if (!picked.size) { alert('先剔好要嘅股票'); return; }
  const ts = [...picked].sort(codeCmp);
  if (!confirm(`將每日清單改做呢 ${ts.length} 隻？\n${ts.join('、')}`)) return;
  try { watch = (await api('/api/watchlist', {method: 'POST', body: JSON.stringify({tickers: ts})})).tickers; drawWatch(); $('sgoMsg').innerHTML = '<span class="ok">每日清單已更新</span>'; }
  catch (e) { alert('存唔到：' + e.message); }
};
$('sall').onclick = () => { shown().filter(x => x.status === 'ok').forEach(x => picked.add(x.ticker)); drawStocks(); };
$('snone').onclick = () => { picked.clear(); drawStocks(); };
$('sgo').onclick = async () => {
  const by = Object.fromEntries(stocks.map(x => [x.ticker, x]));
  const again = [...picked].filter(t => by[t] && by[t].done && by[t].done !== 'busy').sort(codeCmp);
  if (again.length && !confirm(`以下 ${again.length} 隻 ${$('sdate').value} 已經出過報告：\n${again.map(t => t + '（' + (by[t].done === 'site' ? '本站已出' : 'Drive 已有') + '）').join('、')}\n\n再做會再收一次費（每隻約 US$2–8）。確定要重做？`)) return;
  if (picked.size > 5 && !confirm(`出 ${picked.size} 隻股票報告，估計 US$${picked.size * 2}–${picked.size * 4}、要 ${Math.ceil(picked.size / 2) * 15} 分鐘左右。確定？`)) return;
  $('sgo').disabled = true; $('sgoMsg').textContent = '';
  try {
    const r = await api('/api/generate', {method: 'POST', body: JSON.stringify({kind: 'stock', date: $('sdate').value, tickers: [...picked], upload: $('sup').checked})});
    $('sgoMsg').innerHTML = `<span class="ok">已加入 ${r.created} 隻（其餘已經做緊），下面睇進度</span>`; picked.clear(); drawStocks(); loadJobs();
  } catch (e) { $('sgoMsg').innerHTML = `<span class="bad">${esc(e.message)}</span>`; $('sgo').disabled = false; }
};
function start(user) {
  $('login').hidden = true; $('app').hidden = false;
  if (user) $('who').innerHTML = (user === '密碼' ? '已用密碼登入' : '已登入：' + esc(user)) + ' · <a href="/auth/logout" id="logout">登出</a>';
  loadDates(); loadJobs(); loadWatch();
}
(async () => {
  const err = new URLSearchParams(location.search).get('login_error'); if (err) history.replaceState(null, '', '/');
  try { const r = await fetch('/api/me', {headers: {'x-password': PW}}); const me = await r.json(); auth = me; if (me.user) return start(me.user); } catch (e) {}
  showLogin(err || '');
})();
document.addEventListener('click', e => { if (e.target.id === 'logout') { try { localStorage.removeItem('pw'); } catch (x) {} } });
</script>
</body>
